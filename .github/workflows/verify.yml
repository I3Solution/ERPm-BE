name: Verify backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_verification_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ERPM_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci_verification_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build ERPm.sln
      - run: dotnet run --project tests/ERPm.Hrm.Verification --no-build
      - run: dotnet run --project tests/ERPm.Verification --no-build
