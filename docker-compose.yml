services:
  postgres:
    image: postgres:16-alpine
    container_name: erpm_postgres
    restart: always
    environment:
      POSTGRES_DB: erpm_db
      POSTGRES_USER: erpm_user
      POSTGRES_PASSWORD: erpm_password123
    ports:
      - "5432:5432"
    volumes:
      - erpm_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erpm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erpm.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  erpm_pgdata:
